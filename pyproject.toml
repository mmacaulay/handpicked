[project]
name = "handpicked"
version = "0.1.0"
description = "Household-curator recommender for Plex"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "tzlocal>=5.4",
]

[project.scripts]
handpicked = "handpicked.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
