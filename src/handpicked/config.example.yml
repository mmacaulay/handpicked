# Handpicked configuration, read from /config/config.yml (or HANDPICKED_CONFIG).
# The file is optional: the Unraid template's fields set everything most
# installs need. Use it to tune the thresholds, or to run without the template.
#
# These environment variables (the template's fields) win over this file:
#   HANDPICKED_TAUTULLI_URL, HANDPICKED_TAUTULLI_API_KEY,
#   HANDPICKED_SEERR_URL, HANDPICKED_SEERR_API_KEY, HANDPICKED_TMDB_TOKEN,
#   HANDPICKED_SCHEDULE, HANDPICKED_PICKS_PER_RUN,
#   HANDPICKED_SMTP_HOST, HANDPICKED_SMTP_USERNAME, HANDPICKED_SMTP_PASSWORD,
#   HANDPICKED_DIGEST_RECIPIENTS (comma-separated)

services:
  tautulli:
    url: http://tautulli:8181
    api_key: your-tautulli-api-key
  seerr:
    url: http://seerr:5055
    api_key: your-seerr-api-key
    # Seerr id of a local user (e.g. "Handpicked") that creates the requests
    # before they are handed to each member, needed once dry_run is off. Give
    # it Request, no request limit, and nothing that approves requests
    # (Admin, Manage Requests, Auto-Approve), so they stay pending. The id is
    # in the user's Seerr URL, /users/<id>.
    # request_user_id: 5
  tmdb:
    token: your-tmdb-v4-read-token

# Compute and report everything, write nothing to Seerr. On by default so a
# fresh install is safe; set to false once the dry-run picks look right.
dry_run: true

# Cron expression for the run (default: Sundays at 09:00), in the container's
# time zone (TZ). Name the day of the week (SUN, MON-FRI): numbers are
# rejected, since the scheduler counts 0 as Monday, not Sunday. Set a day of
# the month or a day of the week, not both. Changes to the schedule take effect
# after a restart; other settings apply from the next run.
schedule: "0 9 * * SUN"

# Default picks per included user per run.
picks_per_run: 3

thresholds:
  completion_pct: 80          # finished at or above this % counts as a seed
  abandon_pct: 25             # stopped below this % counts as abandoned
  seed_window_days: 90        # how far back seeds are taken from
  min_seeds: 3                # users with fewer seeds are skipped
  min_vote_count: 100         # ignore TMDB titles with fewer votes
  tv_min_finished_episodes: 3 # finished episodes before a show is a seed
  tv_abandon_weeks: 4         # weeks without returning before a show is abandoned

# Users are not configured here. Run `handpicked users` to list them and
# `handpicked users set <name> --include` to opt one in.

# Weekly digest email to the admin, sent after every run, dry runs included.
# Optional until the digest is set up. Use an app password where the mail
# provider offers one (Gmail, iCloud), not the account password.
# digest:
#   host: smtp.example.com
#   security: starttls   # starttls, ssl, or none
#   port: 587            # defaults to 587 for starttls, 465 for ssl, 25 for none
#   username: handpicked@example.com
#   password: your-smtp-password
#   sender: handpicked@example.com  # defaults to username
#   recipients:
#     - admin@example.com
